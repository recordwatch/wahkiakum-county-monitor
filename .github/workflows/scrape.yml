name: Scrape Wahkiakum Roster

# Triggered every 30 minutes by cron-job.org via workflow_dispatch.
# No GitHub `schedule:` on purpose: GitHub ran only 11–13% of scheduled runs
# at Whatcom, and having both would double up runs.
on:
  workflow_dispatch:
    inputs:
      allow_fresh_start:
        description: 'FIRST RUN ONLY: allow starting with no data files'
        type: boolean
        default: false
      confirm_zero:
        description: 'Accept an empty roster now instead of waiting for a second empty run'
        type: boolean
        default: false

permissions:
  contents: write

# One writer to data/ at a time. Queued runs wait instead of overlapping.
concurrency:
  group: scrape-data
  cancel-in-progress: false

env:
  TZ: America/Los_Angeles

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ref: main, so a run that sat in the queue still starts from the
      # latest data, not the commit that triggered it.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # A failed install or scrape doesn't end the run here. The health step
      # below decides whether it's been broken long enough to fail (and email).
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      # Exit 0 = ok. Exit 2 = data written but needs a look (counts as a
      # failure toward the 24 hours; data is still committed below).
      # Exit 1 = nothing written.
      - name: Run scraper
        id: scrape
        continue-on-error: true
        timeout-minutes: 10
        run: node scrape.js
        env:
          ALLOW_FRESH_START: ${{ inputs.allow_fresh_start && '1' || '' }}
          CONFIRM_ZERO: ${{ inputs.confirm_zero && '1' || '' }}

      - name: Record scraper health
        id: health
        run: |
          if [ "${{ steps.install.outcome }}" = success ] && [ "${{ steps.scrape.outcome }}" = success ]; then
            bash .github/scripts/scrape-health.sh success
          else
            bash .github/scripts/scrape-health.sh failure
          fi

      # Runs even if the scraper step failed, so a failed run never throws
      # away scraped data. A commit problem is a warning; the next run commits.
      - name: Commit data
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bash scripts/commit-data.sh

      - name: Fail if the scraper has been broken for 24 hours
        if: steps.health.outputs.fail == 'true'
        run: exit 1

  # Separate job, after the data commit: a broken frontend build can only
  # fail this job, never lose scraped data. Runs even when the scraper was
  # red, so the site always shows the latest committed data.
  # Publishing problems never fail the workflow; the next run republishes.
  deploy:
    needs: scrape
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Latest main, so the deploy includes the data commit the scrape job just pushed.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build site data (windowed, trimmed)
        run: node scripts/build-site-data.js

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
